name: Build PanDa Mod APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-platform: 'android-30'
        sdk-build-tools: '30.0.3'

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r25b

    - name: Clean SDK (remove ALL except android-30)
      run: |
        echo "=== BEFORE ==="
        ls $ANDROID_SDK_ROOT/platforms/ 2>/dev/null
        ls $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null
        
        for dir in $ANDROID_SDK_ROOT/platforms/*/; do
          dirname=$(basename "$dir")
          if [ "$dirname" != "android-30" ]; then
            rm -rf "$dir"
          fi
        done
        
        for dir in $ANDROID_SDK_ROOT/build-tools/*/; do
          dirname=$(basename "$dir")
          if [ "$dirname" != "30.0.3" ]; then
            rm -rf "$dir"
          fi
        done
        
        echo "=== AFTER ==="
        ls $ANDROID_SDK_ROOT/platforms/ 2>/dev/null
        ls $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null

    - name: Download Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip

    - name: Fix build.gradle
      run: |
        if ! grep -q "namespace" app/build.gradle 2>/dev/null; then
          sed -i '/^android {/a \    namespace "uk.lgl"' app/build.gradle
          echo "Added namespace"
        fi
        
        sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86'/abiFilters 'armeabi-v7a'/" app/build.gradle
        sed -i "s/ndkVersion = '22.0.7026061'/ndkVersion '25.2.9519653'/" app/build.gradle
        
        echo "=== FIXED build.gradle ==="
        cat app/build.gradle

    - name: Generate root files if missing
      run: |
        if [ ! -f "build.gradle" ]; then
          cat > build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF
        fi

        if [ ! -f "gradle.properties" ]; then
          cat > gradle.properties << 'EOF'
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        EOF
        fi

        if [ ! -f "settings.gradle" ]; then
          echo 'include ":app"' > settings.gradle
          echo 'rootProject.name = "PanDa-Mod"' >> settings.gradle
        fi

        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Build APK
      run: |
        ./gradle-8.5/bin/gradle assembleRelease -Pandroid.injected.build.abi=armeabi-v7a --stacktrace 2>&1
      env:
        ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    - name: Collect Output
      run: |
        mkdir -p output
        APK=$(find . -name "*.apk" | head -1)
        if [ -n "$APK" ]; then
          cp "$APK" output/PanDa-Mod.apk
          cd output
          unzip -o PanDa-Mod.apk classes*.dex
          cd ..
        fi
        find . -name "libMaino.so" -exec cp {} output/ \;
        find . -name "libc++_shared.so" -exec cp {} output/libGames.so \;
        ls -la output/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PanDa-Mod-APK
        path: output/
        retention-days: 30
