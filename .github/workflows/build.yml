name: Build PanDa Mod APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-platform: 'android-30'
        sdk-build-tools: '30.0.3'

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r25b

    - name: Remove problematic SDK packages
      run: |
        grep -rl 'version="[0-9]*x' $ANDROID_SDK_ROOT --include="package.xml" 2>/dev/null | while read f; do
          rm -rf "$(dirname "$f")"
        done
        echo "Done"

    - name: Download Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip

    - name: Show existing build.gradle
      run: |
        echo "=== EXISTING build.gradle ==="
        cat app/build.gradle 2>/dev/null || echo "NOT FOUND"

    - name: Fix build.gradle (add namespace + armeabi-v7a only)
      run: |
        # Add namespace if missing
        if ! grep -q "namespace" app/build.gradle 2>/dev/null; then
          sed -i '/^android {/a \    namespace "uk.lgl"' app/build.gradle
          echo "✅ Added namespace"
        fi

        # Change abiFilters to armeabi-v7a only
        sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86'/abiFilters 'armeabi-v7a'/" app/build.gradle
        echo "✅ Changed abiFilters to armeabi-v7a only"

        # Change ndkVersion to match installed NDK
        sed -i "s/ndkVersion = '22.0.7026061'/ndkVersion '25.2.9519653'/" app/build.gradle
        echo "✅ Updated ndkVersion"

        echo "=== FIXED build.gradle ==="
        cat app/build.gradle

    - name: Generate root build.gradle if missing
      run: |
        if [ ! -f "build.gradle" ]; then
          cat > build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF
          echo "✅ Generated root build.gradle"
        fi

    - name: Generate gradle.properties if missing
      run: |
        if [ ! -f "gradle.properties" ]; then
          cat > gradle.properties << 'EOF'
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        EOF
          echo "✅ Generated gradle.properties"
        fi

    - name: Generate settings.gradle if missing
      run: |
        if [ ! -f "settings.gradle" ]; then
          echo 'include ":app"' > settings.gradle
          echo 'rootProject.name = "PanDa-Mod"' >> settings.gradle
          echo "✅ Generated settings.gradle"
        fi

    - name: Generate local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        echo "✅ Generated local.properties"

    - name: Show structure
      run: |
        echo "=== JAVA FILES ==="
        find . -name "*.java" | grep -v ".git" | head -10
        echo "=== CPP FILES ==="
        find . -name "Main.cpp" | grep -v ".git"
        echo "=== Android.mk ==="
        find . -name "Android.mk" | grep -v ".git"
        echo "=== AndroidManifest ==="
        find . -name "AndroidManifest.xml" | grep -v ".git"

    - name: Build APK
      run: |
        ./gradle-8.5/bin/gradle assembleRelease -Pandroid.injected.build.abi=armeabi-v7a --stacktrace 2>&1
      env:
        ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    - name: Collect Output
      run: |
        mkdir -p output
        APK=$(find . -name "*.apk" | head -1)
        if [ -n "$APK" ]; then
          cp "$APK" output/PanDa-Mod.apk
          cd output
          unzip -o PanDa-Mod.apk classes*.dex
          cd ..
        fi
        find . -name "libMaino.so" -exec cp {} output/ \;
        find . -name "libc++_shared.so" -exec cp {} output/libGames.so \;
        ls -la output/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PanDa-Mod-APK
        path: output/
        retention-days: 30
