name: Build PanDa (NDK Direct - No Gradle)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r26d

    - name: Build libMaino.so (ARM32)
      run: |
        CPP_DIR=$(dirname $(find . -name "Main.cpp" | grep -v cpp/main.cpp | head -1))
        [ -z "$CPP_DIR" ] && CPP_DIR=$(dirname $(find . -name "Main.cpp" | head -1))
        echo "Folder: $CPP_DIR"
        cd "$CPP_DIR"
        
        CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
        
        SOURCES=""
        for f in $(find . -maxdepth 2 \( -name "*.cpp" -o -name "*.c" \) | grep -v ".git" | grep -v "Utils.cpp" | sort); do
          SOURCES="$SOURCES $f"
        done
        
        INCS=""
        for d in $(find . -maxdepth 2 -type d | grep -v ".git" | sort); do
          INCS="$INCS -I$d"
        done
        
        $CXX -std=c++17 -shared -fPIC -fno-rtti -fno-exceptions -fpermissive -Wno-everything \
          -o libMaino.so $SOURCES -llog -landroid $INCS 2>&1
        
        ls -la libMaino.so
        file libMaino.so

    - name: Prepare Output
      run: |
        mkdir -p output
        CPP_DIR=$(dirname $(find . -name "Main.cpp" | grep -v cpp/main.cpp | head -1))
        [ -z "$CPP_DIR" ] && CPP_DIR=$(dirname $(find . -name "Main.cpp" | head -1))
        
        cp "$CPP_DIR/libMaino.so" output/
        cp $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so output/libGames.so
        
        file output/*

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: PanDa-Mod
        path: output/
        retention-days: 30
