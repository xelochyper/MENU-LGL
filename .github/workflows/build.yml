name: Build PanDa Mod (DEX + SO)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-platform: 'android-30'
        sdk-build-tools: '33.0.2'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r26d

    - name: Show Structure
      run: |
        echo "=== JAVA FILES ==="
        find . -name "*.java" | grep -v ".git" | sort
        echo "=== BUILD FILES ==="
        find . \( -name "build.gradle" -o -name "settings.gradle" \) | grep -v ".git"
        echo "=== ROOT ==="
        ls -la

    # ============================================================
    # METHOD 1: GRADLE BUILD (Full APK)
    # ============================================================
    - name: Gradle Build (Attempt)
      id: gradle
      continue-on-error: true
      run: |
        # Fix gradle wrapper if missing
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Generating gradle wrapper..."
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          rm -rf gradle-8.5-bin.zip gradle-8.5
        fi
        chmod +x ./gradlew
        
        ./gradlew assembleRelease \
          -Pandroid.injected.build.abi=armeabi-v7a \
          --stacktrace 2>&1
      env:
        ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    # ============================================================
    # METHOD 2: MANUAL BUILD (Fallback - if Gradle fails)
    # ============================================================
    - name: Manual Build (Fallback)
      if: steps.gradle.outcome != 'success'
      run: |
        echo "=== Gradle failed. Using manual build... ==="
        mkdir -p build/classes output
        
        ANDROID_JAR=$(find $ANDROID_SDK_ROOT -name "android.jar" | head -1)
        echo "android.jar: $ANDROID_JAR"
        
        # --- STEP 1: COMPILE JAVA → .class ---
        JAVA_FILES=$(find . -name "*.java" | grep -v ".git")
        echo "Compiling $(echo "$JAVA_FILES" | wc -l) Java files..."
        
        javac -d build/classes -cp "$ANDROID_JAR" $JAVA_FILES 2>&1
        
        CLASS_COUNT=$(find build/classes -name "*.class" | wc -l)
        echo "✅ Compiled: $CLASS_COUNT classes"
        
        if [ $CLASS_COUNT -eq 0 ]; then
          echo "❌ javac failed - no .class files"
          exit 1
        fi
        
        # --- STEP 2: CONVERT .class → classes.dex ---
        D8=$(find $ANDROID_SDK_ROOT -name "d8" | head -1)
        [ -z "$D8" ] && D8=$(find $ANDROID_SDK_ROOT -path "*/d8*" -name "d8" | head -1)
        echo "d8: $D8"
        
        $D8 --output output/classes.dex $(find build/classes -name "*.class") 2>&1
        
        if [ -f "output/classes.dex" ]; then
          echo "✅ classes.dex created!"
          ls -la output/classes.dex
        else
          echo "❌ d8 failed"
          exit 1
        fi
        
        # --- STEP 3: BUILD .so (backup) ---
        CPP_DIR=$(dirname $(find . -name "Main.cpp" | grep -v cpp/main.cpp | head -1))
        cd "$CPP_DIR"
        
        CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
        
        SOURCES=$(find . -maxdepth 2 \( -name "*.cpp" -o -name "*.c" \) | grep -v "Utils.cpp" | tr '\n' ' ')
        INCS=$(find . -maxdepth 2 -type d | grep -v ".git" | sed 's/^/-I/' | tr '\n' ' ')
        
        $CXX -std=c++17 -shared -fPIC -fno-rtti -fno-exceptions -fpermissive -Wno-everything \
          -o libMaino.so $SOURCES -llog -landroid $INCS
        
        cp libMaino.so ../../output/ 2>/dev/null || cp libMaino.so ../../../output/ 2>/dev/null || true
        
        # Copy STL as libGames.so
        cp $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ../../output/libGames.so 2>/dev/null || true
        
        echo "✅ .so files built!"
      env:
        ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    # ============================================================
    # COLLECT OUTPUT
    # ============================================================
    - name: Collect All Output
      run: |
        mkdir -p output
        
        # If Gradle succeeded - extract from APK
        if [ "${{ steps.gradle.outcome }}" = "success" ]; then
          echo "=== Gradle succeeded - extracting from APK ==="
          APK=$(find . -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" output/PanDa-Mod.apk
            # Extract classes.dex from APK
            cd output
            unzip -o PanDa-Mod.apk classes*.dex
            cd ..
            # Copy .so from APK build
            find . -name "libMaino.so" -exec cp {} output/ \;
            find . -name "libc++_shared.so" -exec cp {} output/libGames.so \;
          fi
        fi
        
        # Verify output
        echo "=== FINAL OUTPUT ==="
        ls -la output/
        echo "=== FILE TYPES ==="
        file output/* 2>/dev/null || echo "No files"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PanDa-Mod-Complete
        path: output/
        retention-days: 30
