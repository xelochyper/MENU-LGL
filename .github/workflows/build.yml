name: Build PanDa Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r26d

    - name: Build
      run: |
        # Find cpp directory
        CPP_DIR=$(find . -name "Main.cpp" -exec dirname {} \; | head -1)
        
        if [ -z "$CPP_DIR" ]; then
          CPP_DIR=$(find . -type d \( -name "cpp" -o -name "jni" \) -not -path "*/.git/*" | head -1)
        fi
        
        echo "Building in: $CPP_DIR"
        cd "$CPP_DIR"
        ls -la
        
        CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
        
        # Collect sources
        SOURCES=""
        for f in $(find . -maxdepth 2 \( -name "*.cpp" -o -name "*.c" \) | sort); do
          SOURCES="$SOURCES $f"
        done
        echo "Sources: $SOURCES"
        
        # Collect includes
        INCS=""
        for d in . Includes KittyMemory Substrate And64InlineHook Menu; do
          [ -d "$d" ] && INCS="$INCS -I$d"
        done
        
        # COMPILE
        $CXX -std=c++17 \
          -shared -fPIC \
          -fno-rtti -fno-exceptions \
          -Wno-everything \
          -o libPanDa.so \
          $SOURCES \
          -llog -landroid \
          $INCS
        
        # Verify
        ls -la libPanDa.so
        file libPanDa.so

    - name: Output
      run: |
        mkdir -p output/
        CPP_DIR=$(find . -name "Main.cpp" -exec dirname {} \; | head -1)
        [ -z "$CPP_DIR" ] && CPP_DIR=$(find . -type d \( -name "cpp" -o -name "jni" \) -not -path "*/.git/*" | head -1)
        
        cp "$CPP_DIR/libPanDa.so" output/
        cp $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so output/libGamEs.so
        
        file output/*

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: PanDa-Mod
        path: output/
        retention-days: 30
