name: Build PanDa Mod APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-platform: 'android-30'
        sdk-build-tools: '30.0.3'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r26d

    - name: Grant Permission
      run: chmod +x ./gradlew

    - name: Debug - Show Structure
      run: |
        echo "=== ROOT ==="
        ls -la
        echo "=== SETTINGS.GRADLE ==="
        cat settings.gradle 2>/dev/null || echo "tidak ada"
        echo "=== BUILD.GRADLE (root) ==="
        cat build.gradle 2>/dev/null || echo "tidak ada"
        echo "=== BUILD.GRADLE (app) ==="
        cat app/build.gradle 2>/dev/null || echo "tidak ada"
        echo "=== MANIFEST ==="
        find . -name "AndroidManifest.xml" | head -5
        echo "=== JAVA FILES ==="
        find . -name "*.java" | head -20
        echo "=== CPP FILES ==="
        find . -name "*.cpp" -o -name "*.c" | head -20
        echo "=== ANDROID.MK ==="
        find . -name "Android.mk" | head -3
        echo "=== CMAKELISTS ==="
        find . -name "CMakeLists.txt" | head -3

    - name: Build APK (assembleRelease)
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.build.abi=armeabi-v7a \
          -Dorg.gradle.jvmargs="-Xmx2048m" \
          --stacktrace
      env:
        ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    - name: Prepare Output
      run: |
        mkdir -p output/
        
        # Cari APK hasil build
        APK_FILE=$(find . -name "*.apk" -path "*/release/*" | head -1)
        if [ -z "$APK_FILE" ]; then
          APK_FILE=$(find . -name "*.apk" | grep -v "unsigned" | head -1)
        fi
        
        if [ -n "$APK_FILE" ]; then
          cp "$APK_FILE" output/PanDa-Mod.apk
          echo "✅ APK: $APK_FILE"
        else
          echo "❌ APK tidak ditemukan"
          find . -name "*.apk" 
        fi
        
        # Bonus: extract .so juga
        SO_FILE=$(find . -name "libMaino.so" | head -1)
        if [ -n "$SO_FILE" ]; then
          cp "$SO_FILE" output/
          echo "✅ SO: $SO_FILE"
        fi
        
        STL_FILE=$(find . -name "libc++_shared.so" | head -1)
        if [ -n "$STL_FILE" ]; then
          cp "$STL_FILE" output/libGames.so
          echo "✅ STL: $STL_FILE"
        fi
        
        ls -la output/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PanDa-Mod-APK
        path: output/
        retention-days: 30
