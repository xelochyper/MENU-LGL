name: Build PanDa Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r26d

    - name: Build Native Library
      run: |
        echo "========== STRUKTUR =========="
        find . -name "*.cpp" -o -name "*.c" | grep -v ".git" | sort
        
        # Cari folder Main.cpp
        CPP_DIR=$(dirname $(find . -name "Main.cpp" | head -1))
        [ -z "$CPP_DIR" ] && CPP_DIR="."
        echo "Folder: $CPP_DIR"
        cd "$CPP_DIR"
        
        CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
        
        # AUTO-DETECT semua file source
        SOURCES=""
        for f in $(find . -maxdepth 2 \( -name "*.cpp" -o -name "*.c" \) | sort); do
          SOURCES="$SOURCES $f"
          echo "+ $f"
        done
        
        # AUTO-DETECT semua include dirs
        INCS=""
        for d in $(find . -maxdepth 2 -type d | grep -v ".git" | sort); do
          INCS="$INCS -I$d"
        done
        
        echo "========== COMPILE =========="
        echo "Sources: $SOURCES"
        
        $CXX -std=c++17 \
          -shared -fPIC \
          -fno-rtti -fno-exceptions -fpermissive \
          -Wno-everything \
          -o libPanDa.so \
          $SOURCES \
          -llog -landroid \
          $INCS 2>&1 | tail -30
        
        # Cek hasil
        if [ ! -f "libPanDa.so" ]; then
          echo "❌ GAGAL - libPanDa.so tidak dibuat"
          exit 1
        fi
        
        echo "========== SUCCESS =========="
        ls -la libPanDa.so
        file libPanDa.so

    - name: Prepare Output
      run: |
        mkdir -p output/
        CPP_DIR=$(dirname $(find . -name "Main.cpp" | head -1))
        [ -z "$CPP_DIR" ] && CPP_DIR="."
        
        cp "$CPP_DIR/libPanDa.so" output/
        cp $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so output/libGamEs.so
        
        echo "=== FILES ==="
        file output/*

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PanDa-Mod
        path: output/
        retention-days: 30
