name: Build PanDa Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-platform: 'android-30'
        sdk-build-tools: '30.0.3'

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r26d

    - name: Download Gradle (No Wrapper Needed!)
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "✅ Gradle: $(./gradle-8.5/bin/gradle --version | head -1)"

    - name: Generate Missing Build Files
      run: |
        # settings.gradle
        if [ ! -f "settings.gradle" ]; then
          echo 'include ":app"' > settings.gradle
          echo 'rootProject.name = "PanDa-Mod"' >> settings.gradle
          echo "✅ Generated settings.gradle"
        fi

        # build.gradle (root)
        if [ ! -f "build.gradle" ]; then
          cat > build.gradle << 'GRADLE'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        GRADLE
          echo "✅ Generated build.gradle"
        fi

        # app/build.gradle
        if [ ! -f "app/build.gradle" ]; then
          mkdir -p app
          cat > app/build.gradle << 'GRADLE'
        apply plugin: 'com.android.application'
        android {
            compileSdkVersion 30
            buildToolsVersion "30.0.3"
            defaultConfig {
                applicationId "com.android.support"
                minSdkVersion 21
                targetSdkVersion 30
                versionCode 1
                versionName "1.0"
                ndk { abiFilters 'armeabi-v7a' }
                externalNativeBuild {
                    cmake {
                        cppFlags '-std=c++17 -fno-rtti -fno-exceptions -fpermissive'
                        arguments '-DANDROID_STL=c++_shared'
                    }
                }
            }
            externalNativeBuild {
                cmake {
                    path "src/main/jni/CMakeLists.txt"
                }
            }
            buildTypes {
                release { minifyEnabled false }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.3.0'
        }
        GRADLE
          echo "✅ Generated app/build.gradle"
        fi

        # gradle.properties
        if [ ! -f "gradle.properties" ]; then
          cat > gradle.properties << 'PROP'
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        PROP
          echo "✅ Generated gradle.properties"
        fi

        # local.properties
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
        echo "✅ Generated local.properties"

        # CMakeLists.txt (if missing)
        JNI_DIR=$(find . -type d -name "jni" | grep -v ".git" | head -1)
        if [ -n "$JNI_DIR" ] && [ ! -f "$JNI_DIR/CMakeLists.txt" ]; then
          cat > "$JNI_DIR/CMakeLists.txt" << 'CMAKE'
        cmake_minimum_required(VERSION 3.4.1)
        add_library(Maino SHARED
            Main.cpp
            KittyMemory/KittyMemory.cpp
            KittyMemory/MemoryPatch.cpp
            KittyMemory/MemoryBackup.cpp
            KittyMemory/KittyUtils.cpp
            Substrate/SubstrateHook.cpp
            Substrate/SubstrateDebug.cpp
            Substrate/SubstratePosixMemory.cpp
            Substrate/SymbolFinder.cpp
            Substrate/hde64.c
            And64InlineHook/And64InlineHook.cpp
        )
        include_directories(
            ${CMAKE_CURRENT_SOURCE_DIR}
            ${CMAKE_CURRENT_SOURCE_DIR}/Includes
            ${CMAKE_CURRENT_SOURCE_DIR}/KittyMemory
            ${CMAKE_CURRENT_SOURCE_DIR}/Substrate
            ${CMAKE_CURRENT_SOURCE_DIR}/And64InlineHook
        )
        target_link_libraries(Maino log android GLESv2)
        CMAKE
          echo "✅ Generated CMakeLists.txt"
        fi

        echo "=== ALL BUILD FILES ==="
        find . \( -name "build.gradle" -o -name "settings.gradle" -o -name "CMakeLists.txt" -o -name "gradle.properties" \) | grep -v ".git"

    - name: Build APK with Gradle
      run: |
        ./gradle-8.5/bin/gradle assembleRelease \
          -Pandroid.injected.build.abi=armeabi-v7a \
          --stacktrace 2>&1
      env:
        ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    - name: Collect All Output
      run: |
        mkdir -p output
        
        # Find APK
        APK=$(find . -name "*.apk" | head -1)
        if [ -n "$APK" ]; then
          cp "$APK" output/PanDa-Mod.apk
          echo "✅ APK found"
          
          # Extract classes.dex
          cd output
          unzip -o PanDa-Mod.apk classes*.dex
          cd ..
          echo "✅ classes.dex extracted"
        fi
        
        # Copy .so files
        find . -name "libMaino.so" -exec cp {} output/ \;
        find . -name "libc++_shared.so" -exec cp {} output/libGames.so \;
        
        # Also check for .so with old name
        find . -name "libMyModMenu.so" -o -name "liblgl.so" | while read f; do
          cp "$f" output/
        done
        
        echo "=== FINAL OUTPUT ==="
        ls -la output/
        file output/* 2>/dev/null || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PanDa-Mod-Complete
        path: output/
        retention-days: 30
