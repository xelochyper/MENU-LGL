name: Build PanDa Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r26d

    - name: Build Native Library
      run: |
        CPP_DIR=$(dirname $(find . -name "Main.cpp" | grep -v cpp/main.cpp | head -1))
        [ -z "$CPP_DIR" ] && CPP_DIR="."
        echo "Folder: $CPP_DIR"
        cd "$CPP_DIR"
        
        CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
        
        # Sources — TANPA Utils.cpp (xDL tidak ada)
        SOURCES=""
        for f in $(find . -maxdepth 2 \( -name "*.cpp" -o -name "*.c" \) | grep -v ".git" | grep -v "Utils.cpp" | sort); do
          SOURCES="$SOURCES $f"
        done
        echo "Sources: $SOURCES"
        
        INCS=""
        for d in $(find . -maxdepth 2 -type d | grep -v ".git" | sort); do
          INCS="$INCS -I$d"
        done
        
        echo "========== COMPILE =========="
        $CXX -std=c++17 \
          -shared -fPIC \
          -fno-rtti -fno-exceptions -fpermissive \
          -Wno-everything \
          -o libMaino.so \
          $SOURCES \
          -llog -landroid \
          $INCS 2>&1
        
        if [ ! -f "libMaino.so" ]; then
          echo "❌ GAGAL"
          exit 1
        fi
        
        echo "✅ SUCCESS"
        ls -la libMaino.so
        file libMaino.so

    - name: Prepare Output
      run: |
        mkdir -p output/
        CPP_DIR=$(dirname $(find . -name "Main.cpp" | grep -v cpp/main.cpp | head -1))
        [ -z "$CPP_DIR" ] && CPP_DIR="."
        
        cp "$CPP_DIR/libMaino.so" output/
        cp $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so output/libGames.so
        
        echo "=== VERIFIKASI ==="
        file output/libMaino.so
        file output/libGames.so
        ls -la output/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Maino-Mod
        path: output/
        retention-days: 30
